<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prerelease test board — TOR Mods</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Internal checklist of everything that is built but not yet confirmed in a playtest." />
  <meta name="theme-color" content="#141312" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
  <script>
    // set the theme before first paint to avoid a flash
    (function () {
      var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
      var t = get("tormods-theme");
      if (t !== "light" && t !== "dark")
        t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.fx =
        get("tormods-fx") === "off" ? "off" : "on";
    })();
  </script>
  <link rel="stylesheet" href="assets/fonts.css" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body data-page="test">
  <header id="topbar"></header>
  <main id="content"></main>
  <footer id="footer"></footer>
  <button id="backTop" aria-label="Back to top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

  <script src="assets/data.js"></script>
  <script src="assets/hero.js"></script>
  <script src="assets/fx.js"></script>
  <script src="assets/prerelease.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/scroll.js"></script>
  <script type="module" src="assets/bg3d.js"></script>
</body>
</html>
