<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Prerelease test board — TOR Mods</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Internal checklist of everything that is built but not yet confirmed in a playtest." />
  <meta name="theme-color" content="#141312" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='22' width='12' height='26' rx='6' fill='%23b58a1f'/%3E%3Cpath d='M17 27C17 14 24 6 33 6s16 8 16 21v21c0 6-4 10-10 10h-3v-8h-8v8h-3c-6 0-10-4-10-10z' fill='%23f7c948'/%3E%3Cellipse cx='41' cy='24' rx='12' ry='8' fill='%23bfe8f7'/%3E%3Cellipse cx='45' cy='22' rx='5' ry='3' fill='%23eafcff'/%3E%3C/svg%3E" />
  <script>
    // set the theme before first paint to avoid a flash
    (function () {
      var t = localStorage.getItem("tormods-theme");
      if (t !== "light" && t !== "dark")
        t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.fx =
        localStorage.getItem("tormods-fx") === "off" ? "off" : "on";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>

</body>
</html>
