<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unknown's Atlas | TOR Mods Wiki</title>
  <meta name="description" content="Unknown's Atlas for The Other Roles: two new Among Us maps, the Vesper Museum and the Forest Station, selectable in Freeplay and the lobby." />
  <meta name="theme-color" content="#141312" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23e0b04a' stroke-width='6'/%3E%3Cpath d='M32 12 L38 32 L32 52 L26 32 Z' fill='%23e0b04a'/%3E%3C/svg%3E" />
  <script>
    // set the theme before first paint to avoid a flash
    (function () {
      var t = localStorage.getItem("tormods-theme");
      if (t !== "light" && t !== "dark")
        t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.fx =
        localStorage.getItem("tormods-fx") === "off" ? "off" : "on";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body data-page="atlas">
  <header id="topbar"></header>
  <main id="content"></main>
  <footer id="footer"></footer>
  <button id="backTop" aria-label="Back to top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

  <script src="assets/data.js"></script>
  <script src="assets/hero.js"></script>
  <script src="assets/fx.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
