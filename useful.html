<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Useful TOR Stuff for The Other Roles: quality-of-life fixes, new role options and an in-game Mod Manager. Click any feature for details." />

  <script>
    // set the theme before first paint to avoid a flash
    (function () {
      var t = localStorage.getItem("tormods-theme");
      if (t !== "light" && t !== "dark")
        t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.fx =
        localStorage.getItem("tormods-fx") === "off" ? "off" : "on";
    })();
  </script>
  <link rel="stylesheet" href="assets/fonts.css" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body data-page="useful">
  <header id="topbar"></header>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="content"></main>
  </div>
  <footer id="footer"></footer>
  <button id="backTop" aria-label="Back to top">↑</button>

  <script src="assets/data.js"></script>
  <script src="assets/fx.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
